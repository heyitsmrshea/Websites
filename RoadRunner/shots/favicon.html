<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  .tile {
    width: 180px; height: 180px;
    background: radial-gradient(120% 120% at 30% 15%, #0c1a22, #04060a 70%);
    display: grid; place-items: center;
    position: relative;
  }
  .tile::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 1px 0 rgba(45,212,191,.25), inset 0 0 60px rgba(45,212,191,.08);
  }
  .tile img { width: 180px; height: 180px; display: block; }
</style></head>
<body><div class="tile"><img src="/assets/roadrunner-favicon.svg" alt=""></div></body></html>
