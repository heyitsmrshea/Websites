    <script>
      // Set the theme on <html> before the bundle paints, so a saved/OS light preference
      // does not flash the default dark tokens first. useTheme() reads the same source.
      (function () {
        try {
          var t = localStorage.getItem('rr-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* ignore */ }
      })();
    </script>
